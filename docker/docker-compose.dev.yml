# Dev-mode override: runs the server and web dev servers (tsx watch, Vite)
# inside containers with source bind-mounted, instead of the baked-in
# production build — edits on the host reflect immediately, no rebuild.
#
# "Immediately" needs CHOKIDAR_USEPOLLING below to be true on macOS. Docker
# Desktop's bind mount does not forward inotify events into the container, so
# both watchers sit silent and keep serving the code they started with. That
# failure is invisible: nothing logs, nothing errors, and every edit simply
# appears to do nothing.
#
# node_modules is backed by a named volume rather than the bind mount so the
# host's node_modules (built for the host OS/arch, e.g. sharp's native
# binary) never shadows the Linux-native modules installed in the image.
#
# Usage:
#   docker compose -p media-server-dev -f docker-compose.yml -f docker-compose.dev.yml up --build
# (`make dev` does this; without -p the stack lands in a separate project.)
#
# First run builds the `deps` stage (full npm ci, including devDependencies)
# instead of the slim production image.

services:
  app:
    image: media-server-app-dev
    build:
      target: deps
    # Set explicitly rather than inherited from the deps stage's WORKDIR, so
    # the dev command still finds the workspace if the image on hand happens
    # to be the production build (whose WORKDIR is /app).
    working_dir: /repo
    command: npm run dev --workspace apps/server
    # Clears the base file's host port publish (!reset drops the inherited
    # list instead of appending to it). In dev, the only port a browser
    # should open is 5173 (Vite, published below) — the web container
    # reaches this one over the compose network (http://app:3000), not
    # through a published host port. Without this, `make dev` would also
    # expose 3000, landing you on the bare API with no HMR and no SPA.
    ports: !reset []
    environment:
      # See the note at the top of this file. tsx bundles chokidar and reads
      # these directly.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      # This machine's address on the wifi, for the local-network switch in
      # Settings to show. A container can only see its own address on the
      # Docker bridge, which is no use to a phone, so it has to be told —
      # docker/with-lan-host.sh does that when it is run in front of docker compose.
      LAN_HOST: ${LAN_HOST:-}
      # The port a phone actually opens: Vite in dev, not the API.
      LAN_PORT: "5173"
    volumes:
      - ..:/repo
      - node_modules:/repo/node_modules
      # Same container path as the base file's backup mount, so this replaces
      # it. Dev backups must not share a folder with the real stack's: the
      # newest-10 pruning would evict real archives, and the real app would
      # list dev archives as restorable.
      - ${DEV_BACKUP_DIR:-../backups-dev}:/app/backups

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: deps
    working_dir: /repo
    command: npm run dev --workspace apps/web
    # YAML anchors don't cross files, so this repeats docker-compose.yml's
    # x-logging block rather than reusing it — same reasoning: cap log growth
    # under Docker's default json-file driver.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PROXY_TARGET: http://app:3000
      # Vite does not read these by itself — apps/web/vite.config.ts turns
      # them into server.watch.usePolling.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "5173:5173"
    volumes:
      - ..:/repo
      - node_modules:/repo/node_modules
    depends_on:
      app:
        condition: service_healthy
    # So a Vite crash (like the sourcemapPathTransform/rolldown mismatch on
    # 2026-10-10) recovers on its own instead of sitting dead until someone
    # notices and runs `make dev` again.
    restart: unless-stopped

volumes:
  # Named per dependency set (see NODE_MODULES_TAG in the Makefile) so a
  # `package-lock.json` change gets a fresh volume instead of silently
  # reusing one installed for older dependencies — that mismatch is what
  # crashed Vite's dev server on 2026-10-10.
  node_modules:
    name: node_modules-${NODE_MODULES_TAG:-default}
